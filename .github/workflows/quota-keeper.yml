name: quota-keeper

on:
  schedule:
    - cron: '0 22 * * *'   # 北京时间 每天 06:00
    - cron: '5 3 * * *'    # 北京时间 每天 11:05
    - cron: '10 8 * * *'   # 北京时间 每天 16:10
    - cron: '15 13 * * *'  # 北京时间 每天 21:15
  workflow_dispatch: {}     # 允许在网页上手动点一次测试

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 跳过 Claude Code 首次引导
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json

      - name: 安装 Node 和 Claude Code
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @anthropic-ai/claude-code

      - name: 发送一条极小请求，开启新的 5 小时额度窗口
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GLM_CODING_PLAN_TOKEN }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3-flash[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3-flash[1m]
          API_TIMEOUT_MS: '3000000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: claude -p "你好"
