<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>改版参考：等待房 1440×900（仅主题，无布局改动）</title>
<style>
  :root {
    --bg: #0e0709;
    --card: #1f1219;
    --border: #4b2e3a;
    --text: #f2e7ea;
    --muted: #b9a3ac;
    --accent-gold: #f5c518;
    --gold-text: #f0c060;
    --gold-dim-bg: #2a1c0d;
    --font-display: "Noto Serif SC", "Source Han Serif SC", STZhongsong, KaiTi, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 90% at 50% 32%, rgba(142, 31, 47, 0.12), transparent 62%),
      radial-gradient(140% 120% at 50% 42%, #1d0f15 0%, #120a0e 55%, #080406 100%);
    background-color: var(--bg);
    min-height: 100vh;
  }
  #root { max-width: 960px; margin: 0 auto; padding: 12px; }
  button {
    min-height: 40px; padding: 6px 14px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: inherit; cursor: pointer;
  }
  .room { display: flex; flex-direction: column; gap: 12px; }
  .room-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .status { text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; color: var(--muted); }
  .roster { padding-left: 20px; }
  .roster li { margin: 4px 0; }
  .roster li.self {
    border: 1px solid var(--accent-gold);
    border-radius: 8px;
    background: var(--gold-dim-bg);
    padding: 2px 8px;
  }
  .hint { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div id="root">
  <div class="room">
    <header class="room-header">
      <span>房间 <strong>458502</strong></span>
      <span class="status">等待开始</span>
      <button>离开</button>
    </header>
    <p>等待玩家加入 (8/12)。分享此房间号，玩家只需房间号和姓名即可加入。</p>
    <ul class="roster">
      <li class="self">阿玫 (你)</li>
      <li>小兽（离线）</li>
      <li>老K（离线）</li>
      <li>阿紫（离线）</li>
      <li>大猫（离线）</li>
      <li>阿飞（离线）</li>
      <li>咪咪（离线）</li>
      <li>团子（离线）</li>
    </ul>
    <p class="hint">开始对局后干涉投票时限固定为 90 秒，倒计时全员可见。</p>
  </div>
</div>
</body>
</html>
